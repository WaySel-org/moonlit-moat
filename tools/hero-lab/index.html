<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1016; color: #cfdcd7; font: 12px ui-monospace, monospace; overflow: hidden; }
  #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 60vw; }
  #ui button { font: inherit; color: #efe6c2; background: #121a20; border: 1px solid #2a3a40; border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  #ui button.on { background: #efe6c2; color: #11161a; }
  #info { position: fixed; left: 12px; bottom: 12px; color: #8fa29b; }
</style>
</head>
<body>
<div id="ui"></div>
<div id="info"></div>
<script src="../../vendor/three.min.js"></script>
<script src="../../src/systems/actors/player/09b-hero-mesh.js"></script>
<script>
// Hero lab: builds the hero exactly as the game does and shows every pose. Drag to orbit, scroll to zoom.
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true }); renderer.setSize(W, H); renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x101820); scene.fog = new THREE.FogExp2(0x101820, 0.06);
const cam = new THREE.PerspectiveCamera(35, W / H, 0.05, 100);
scene.add(new THREE.HemisphereLight(0x8fb4d0, 0x2a2420, 0.55));
const moon = new THREE.DirectionalLight(0xc8d8ff, 1.3); moon.position.set(-2, 4, -3); moon.castShadow = true; moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -0.5 }); scene.add(moon);
const warm = new THREE.PointLight(0xffa050, 1.4, 6, 2); warm.position.set(1.2, 1.2, 1.4); scene.add(warm);
const key = new THREE.DirectionalLight(0xfff0e0, 0.6); key.position.set(2, 3, 3); scene.add(key);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6, 48).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x2a3328, roughness: 1 })); ground.receiveShadow = true; scene.add(ground);

const t0 = performance.now();
const mat = new THREE.MeshStandardMaterial({ vertexColors: true, skinning: true, roughness: 0.82, metalness: 0 });
const R = buildHeroMesh(mat);
const buildMs = Math.round(performance.now() - t0);
R.mesh.castShadow = true; R.mesh.receiveShadow = true;
const body = new THREE.Group(); body.add(R.mesh); scene.add(body);
// A simple stand-in sword so the grip can be judged
const sword = new THREE.Group(); body.add(sword);
const blade = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.012, 0.95), new THREE.MeshStandardMaterial({ color: 0xc8d4dc, metalness: 0.9, roughness: 0.25 })); blade.position.z = 0.6; sword.add(blade);
const grip = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.02, 0.2, 8).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: 0x3a2a1c })); sword.add(grip);
const guard = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.03, 0.03), new THREE.MeshStandardMaterial({ color: 0xb8a070, metalness: 0.7, roughness: 0.4 })); guard.position.z = 0.11; sword.add(guard);

// Sword directions per pose, like the game's poseSword (x pitch, y yaw)
const POSES = {
  idle: { sw: [0.6, -0.35] }, run: { sw: [0.6, -0.35], moving: true, run: 1 },
  'slash 1': { sw: [0.15, 1.2] }, 'slash 2': { sw: [0.15, -1.4] }, 'slash 3': { sw: [-1.2, 0] }, heavy: { sw: [-2.0, 0] },
  block: { sw: [-0.35, 1.25], block: true }, cast: { sw: [0.6, -0.35], act: 'cast' }, drink: { sw: [1.2, -0.7], act: 'drink' },
  jump: { sw: [-0.9, 0], air: true }, ride: { sw: [0.6, -0.35], mount: true }
};
let pose = 'idle', yaw = 0.6, pitch = 0.15, dist = 3.2, auto = true, lookY = 0.9;
const ui = document.getElementById('ui');
Object.keys(POSES).forEach(n => { const b = document.createElement('button'); b.textContent = n; b.onclick = () => { pose = n; [...ui.children].forEach(c => c.classList.toggle('on', c === b)); }; ui.appendChild(b); });
ui.children[0].classList.add('on');
let drag = null;
addEventListener('pointerdown', e => { if (e.target.tagName !== 'BUTTON') { drag = [e.clientX, e.clientY]; auto = false; } });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.008; pitch = Math.max(-0.3, Math.min(1.2, pitch + (e.clientY - drag[1]) * 0.006)); drag = [e.clientX, e.clientY]; });
addEventListener('wheel', e => { dist = Math.max(1.0, Math.min(8, dist * (1 + e.deltaY * 0.001))); });
const tgt = new THREE.Vector3(), pole = new THREE.Vector3(), dir = new THREE.Vector3(), hand = new THREE.Vector3();
let t = 0, last = performance.now();
window.labSet = (p, y, pi, d, ly) => { pose = p; yaw = y; pitch = pi; dist = d; lookY = ly === undefined ? 0.9 : ly; auto = false; };
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now; t += dt; if (auto) yaw += dt * 0.25;
  const P = POSES[pose], stride = P.moving ? Math.sin(t * 10) * 0.6 : 0;
  dir.set(0, 0, 1).applyEuler(new THREE.Euler(P.sw[0], P.sw[1], 0));
  body.updateMatrixWorld(true);
  heroHandTarget(dir, tgt); body.localToWorld(tgt);
  pole.copy(HERO_SHOULDER_R).add(HERO_POLE); body.localToWorld(pole);
  heroPose(R, { t, stride, moving: !!P.moving, run: P.run || 0, mount: !!P.mount, act: P.act, block: !!P.block, air: !!P.air, swordDir: dir }, tgt, pole);
  body.position.y = P.moving ? Math.abs(Math.sin(t * 10)) * 0.06 : (P.mount ? 0.35 : 0);
  R.mesh.updateMatrixWorld(true);
  R.bones.handR.getWorldPosition(hand); body.worldToLocal(hand);
  sword.position.copy(hand); sword.rotation.set(P.sw[0], P.sw[1], 0);
  cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, lookY + Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist);
  cam.lookAt(0, lookY, 0);
  renderer.render(scene, cam);
}
document.getElementById('info').textContent = `${R.mesh.geometry.index.count / 3 | 0} triangles, ${R.mesh.geometry.attributes.position.count} vertices, ${Object.keys(R.bones).length} bones, built in ${buildMs} ms`;
requestAnimationFrame(frame);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); });
</script>
</body>
</html>
