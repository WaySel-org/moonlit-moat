# Local run, hardened the same way as production:  docker compose up --build
services:
  web:
    build:
      context: .
      args:
        VERSION: local
    image: moonlit-moat:local
    ports: ["8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
