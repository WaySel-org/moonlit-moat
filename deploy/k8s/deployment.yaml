# Moonlit Moat on any Kubernetes cluster. Stateless: scale it like any web tier.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: moonlit-moat
  labels: { app: moonlit-moat }
spec:
  replicas: 2
  selector:
    matchLabels: { app: moonlit-moat }
  template:
    metadata:
      labels: { app: moonlit-moat }
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: ghcr.io/waysel-org/moonlit-moat:latest
          ports: [{ containerPort: 8080, name: http }]
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: moonlit-moat
spec:
  selector: { app: moonlit-moat }
  ports: [{ port: 80, targetPort: http, name: http }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: moonlit-moat
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: moonlit-moat }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
