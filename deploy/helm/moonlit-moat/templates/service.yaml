apiVersion: v1
kind: Service
metadata:
  name: {{ include "mm.fullname" . }}
  labels: {{- include "mm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "mm.selector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http, protocol: TCP }
