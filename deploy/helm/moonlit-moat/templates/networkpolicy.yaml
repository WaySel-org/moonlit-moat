{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mm.fullname" . }}
  labels: {{- include "mm.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "mm.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: http, protocol: TCP }]
  egress: []
{{- end }}
