server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
