server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The build writes a .gz beside each text file; serve it to browsers that accept gzip.
    gzip_static on;
    gzip_vary on;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed files: their name changes when their bytes do, so browsers keep them for a year.
    # A location with its own add_header drops the server's, so the security headers are included again.
    location /a/ {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cache-assets.conf;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        include /etc/nginx/snippets/cache-default.conf;
        try_files $uri $uri/ /index.html;
    }
}
